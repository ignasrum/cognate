[package]
name = "cognate-api"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8"
blake3 = "1"
getrandom = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
subtle = "2.6"
thiserror = "2"
tokio = { version = "1", features = ["fs", "macros", "net", "rt-multi-thread", "signal", "time"] }
cognate-engine = { path = "../cognate-engine" }

[dev-dependencies]
http-body-util = "0.1"
tempfile = "3"
tower = "0.5"
reqwest = { version = "0.12", default-features = false, features = ["json"] }
