[package]
name = "cognate-engine"
version = "0.1.1"
edition = "2024"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
pulldown-cmark = "0.13.1"
thiserror = "2.0"
time = { version = "0.3", features = ["formatting", "parsing"] }
base64 = "0.22.1"
blake3 = "1"
tokio = { version = "1", features = ["fs", "io-util", "sync", "rt", "macros"] }

[dev-dependencies]
filetime = "0.2"
